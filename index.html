<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phiếu bài tập Tiếng Việt lớp 3</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#c2185b;--pink-soft:#fde3ee;--leaf:#3f8f3a;--leaf-soft:#e6f4e1;--sky:#eaf6fb;--ink:#2b2a33;--line:#d9e6d3;--paper:#ffffff}
*{box-sizing:border-box}
body{margin:0;background:var(--sky);color:var(--ink);font-family:"Nunito","Segoe UI",Arial,sans-serif;font-size:18px;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:24px 14px 60px}
h1{font-family:"Baloo 2","Nunito",sans-serif;font-weight:800;color:var(--pink);font-size:2.3rem;line-height:1.1;margin:10px 0 6px;text-align:center}
.sub{text-align:center;margin:0 0 22px;color:#55606a}
#list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
#list a{display:flex;align-items:center;gap:14px;background:var(--paper);border:2px solid var(--line);border-left:8px solid var(--leaf);border-radius:18px;padding:14px 16px;text-decoration:none;color:var(--ink);min-height:72px}
#list a:hover,#list a:focus-visible{border-color:var(--pink);border-left-color:var(--pink);background:var(--pink-soft);outline:none}
.week{flex:none;width:64px;height:64px;border-radius:16px;background:var(--leaf-soft);color:var(--leaf);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Baloo 2",sans-serif;font-weight:800;line-height:1}
.week small{font-size:.75rem;font-family:"Nunito",sans-serif}
.week b{font-size:1.7rem}
.info{flex:1;min-width:0}
.info strong{display:block;font-weight:800;font-size:1.1rem}
.info span{color:#6b7680;font-size:.92rem}
.go{flex:none;color:var(--pink);font-weight:800;white-space:nowrap}
.empty{text-align:center;color:#55606a;background:var(--paper);border:2px dashed var(--line);border-radius:18px;padding:24px}
@media (max-width:480px){body{font-size:17px}h1{font-size:1.9rem}.go{display:none}.week{width:56px;height:56px}}
</style>
</head>
<body>
<main>
<h1>Tiếng Việt lớp 3</h1>
<p class="sub">Em chọn tuần để làm phiếu bài tập nhé.</p>
<ul id="list"></ul>
</main>

<script>
/* =====================================================================
   DANH SÁCH PHIẾU - MỖI KHI CÓ PHIẾU MỚI, THÊM MỘT DÒNG VÀO ĐÂY.
   tuan : số tuần
   ten  : tên bài (hiện trên trang chủ)
   file : tên file phiếu đã tải lên cùng thư mục với index.html
   Thứ tự dòng không quan trọng, trang tự xếp theo số tuần.
   ===================================================================== */
var PHIEU = [
  {tuan: 8, ten: "Bạn mới", file: "phieu-lop3-tuan8.html"}
];

(function(){
  var list = document.getElementById("list");
  function esc(t){ return String(t).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  var ds = PHIEU.slice().sort(function(a,b){ return a.tuan - b.tuan; });
  if(!ds.length){ list.outerHTML = '<p class="empty">Chưa có phiếu nào.</p>'; return; }
  list.innerHTML = ds.map(function(p){
    return '<li><a href="'+esc(p.file)+'">'+
      '<span class="week"><small>Tuần</small><b>'+esc(p.tuan)+'</b></span>'+
      '<span class="info"><strong>'+esc(p.ten)+'</strong><span>Phiếu bài tập tuần '+esc(p.tuan)+'</span></span>'+
      '<span class="go">Làm bài →</span></a></li>';
  }).join("");
})();
</script>
</body>
</html>
